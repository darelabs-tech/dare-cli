title: "Adapter Cursor (012) - Development Tasks"
version: "1.0.0"

limits:
  parent_context_chars: 2000
  task_output_chars: 4000
  timeout_seconds: 600

models:
  cursor:      { HIGH: gpt-5.3-codex,     MED: composer-2,       LOW: auto-low }
  claude:      { HIGH: claude-sonnet-4-5, MED: claude-haiku-4,   LOW: claude-haiku-4 }
  antigravity: { HIGH: gemini-2.5-pro,    MED: gemini-2.5-flash, LOW: gemini-2.5-flash }

tasks:
  - id: mp012-001
    title: "Verificar docker-compose.ci.yml"
    depends_on: []
    complexity: LOW
    spec_file: EXECUTION-012/mp012-001.md
    subtask_prompt: |
      Microplano 012 Fase 1 — containerização.
      Validar: `docker compose -f docker-compose.ci.yml config` exit 0.
      Se Docker ausente: YAML parseável documentado. Sem git commit.
      Complete: dare execute --dag DARE/dare-dag-012.yaml --complete mp012-001 --output "..."

  - id: mp012-002
    title: "Congelar detect + generate_cursorrules + preserve"
    depends_on: []
    complexity: MED
    spec_file: EXECUTION-012/mp012-002.md
    subtask_prompt: |
      Microplano 012 Fase 2 — BLUEPRINT-012 §5.1–5.2 T-08/T-09.
      Congelar em crates/dare-harness/src/cursor.rs:
      - detect_cursor(root) -> CursorDetect { cursor_dir, cursorrules } sem side effects
      - generate_cursorrules(root, force) com <!-- dare:managed; body stub §5.2
      - preserve: .cursorrules unmanaged + !force = no-op
      Testes: detect empty; generate managed; preserve unmanaged cursorrules.
      Gate: cargo test -p dare-harness -- cursor::
      Sem git commit. NÃO implementar install_cursor_rules / .mdc.

  - id: mp012-003
    title: "install_cursor_commands + validate (49 + preserve)"
    depends_on: [mp012-002]
    complexity: MED
    spec_file: EXECUTION-012/mp012-003.md
    subtask_prompt: |
      Microplano 012 Fase 3 — BLUEPRINT-012 §5.3 §5.4 T-03/T-11.
      install_cursor_commands: matrix outputs.cursor + render_claude_command + managed prefix.
      force → 49; unmanaged + !force → skip; validate_cursor_install exige paths; missing Err amostra ≤5.
      Testes: install_validate_force (49); preserve_unmanaged_command (48); validate_reports_missing.
      Gate: cargo test -p dare-harness -- cursor::
      Sem git commit. Sem rules .mdc.

  - id: mp012-004
    title: "CLI help --force + install pipeline"
    depends_on: [mp012-002]
    complexity: LOW
    spec_file: EXECUTION-012/mp012-004.md
    subtask_prompt: |
      Microplano 012 Fase 4 — BLUEPRINT-012 §5.5 T-10/T-12 RS-07.
      CursorCmd::Install: clap --force docstring menciona overwrite unmanaged.
      Install: generate_cursorrules → install_cursor_commands (sem rules).
      Gate: cargo build -p dare-cli
      Sem git commit.

  - id: mp012-005
    title: "CLI smoke + docs DEC-013 + exceptions"
    depends_on: [mp012-003, mp012-004]
    complexity: MED
    spec_file: EXECUTION-012/mp012-005.md
    subtask_prompt: |
      Microplano 012 Fase 5.
      cli_smoke: tempdir → dare harness cursor install --force --root … → validate ok 49; detect cursor_dir/cursorrules true.
      EXPANDIR docs/compatibility/harness-cursor.md: CLI, preserve, T-01..T-14, RS, SoT 49 vs 33/25 exceptions, rules .mdc deferred Class C.
      Verificar exceptions no YAML; NÃO remover. NÃO install_cursor_rules.
      Gate: cargo test -p dare-cli --test cli_smoke
      Sem git commit.

  - id: mp012-006
    title: "Auditoria Ralph"
    depends_on: [mp012-001, mp012-005]
    complexity: MED
    spec_file: EXECUTION-012/mp012-006.md
    subtask_prompt: |
      Microplano 012 Fase 6.
      cargo test --workspace; clippy -D warnings; cargo audit; cargo deny check.
      RS checklist na doc. Output exit codes. Sem git commit.

  - id: mp012-007
    title: "Fechamento microplano 012"
    depends_on: [mp012-006]
    complexity: LOW
    spec_file: EXECUTION-012/mp012-007.md
    subtask_prompt: |
      Atualizar TASKS-012: 7/7 DONE. Próximo: 013-adapter-codex. Sem código. Sem git commit.
