  - id: mp028-002
    title: "execution core (ready/compose/snapshot)"
    depends_on: []
    complexity: HIGH
    spec_file: EXECUTION-028/mp028-002.md
    subtask_prompt: |
      Microplano 028 Fase 2 — BLUEPRINT-028 §4–5.5 T-01 T-09–T-16 T-25 T-29 T-30.
      CRIAR crates/dare-dag/src/execution.rs (+ `pub mod execution` / pub use em lib.rs).
      pub enum ExecuteOutcome { Status, NextReady, Resolved, Blocked, Empty, Waiting }
        JSON wire via as_str: status|ready|resolved|blocked|empty|waiting
      pub struct StatusCounts { done,running,pending,failed,skipped,total: u32 }
      pub struct StatusTaskRow { id, title, status, rank, complexity }
      pub struct StatusSnapshot { title, dag_rel, canvas_path, counts, tasks, outcome }
      pub struct ReadyTask { id, title, rank, complexity, spec_file, prompt }
      pub struct NextReport { rank: Option<u32>, ready: Vec<ReadyTask>, outcome }
      pub fn parent_context_limit(doc: &DagDocument) -> usize
        V21: limits.parent_context_chars as usize; Legacy: 2000
      pub fn ready_at_min_rank(doc, state, ranks) -> Vec<String>
        next_executable filtrado ao min rank; ids lexico
      pub fn compose_task_prompt(doc, state, task_id) -> Result<String, DagGraphError>
        base=subtask_prompt; deps DONE com output non-empty; ordem id lexico;
        tail últimos parent_context_limit Unicode scalars;
        se ≥1 pai: anexar "\n\n## Upstream context\n\n### From parent: {id} — {title}\n{tail}\n"
        task ausente → InvalidDag "task not found: …"
      pub fn build_status_snapshot(doc, state, ranks) -> StatusSnapshot
        tasks rank↑ then id; counts por wire status; 0 tasks → outcome Empty else Status
        dag_rel/canvas_path podem ser "" no domínio (CLI preenche)
      pub fn classify_next_outcome(doc, state, ready: &[String]) -> ExecuteOutcome
        empty tasks→Empty; ready non-empty→NextReady; running>0 && ready empty→Waiting;
        ∃PENDING→Blocked; else Resolved
      Constantes pub: MSG_RESOLVED="✅ All tasks resolved."; MSG_BLOCKED="Blocked — no executable tasks";
        MSG_EMPTY="Empty DAG — no tasks.";
      Fixtures MUST: tests/fixtures/dag/exec-empty.v21.yaml (tasks: []);
        exec-blocked.v21.yaml (cadeia onde cascade deixa PENDING bloqueado — ou state inline no teste).
      Testes MUST: ready_at_min_rank_filters; compose_tail_exact_chars; compose_omits_empty_parent;
        classify_empty_blocked_resolved_waiting; parent_context_legacy_2000.
      Gate: cargo test -p dare-dag -- execution
      Sem CLI. Sem Start/transition. Sem git commit.

  - id: mp028-003
