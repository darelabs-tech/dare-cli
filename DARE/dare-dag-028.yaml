    subtask_prompt: |
      Microplano 028 Fase 3 — BLUEPRINT-028 §5.6–5.8 T-02–T-08 T-27 T-28 §0.1.
      CRIAR crates/dare-cli/src/commands/execute.rs (+ pub mod execute).
      Commands::Execute { status:bool, next:bool, watch:bool, dag:Option<PathBuf>,
        interval:u64 default 2, max_ticks:Option<u64> } — ArgGroup exclusivo status|next|watch;
        se todos false → Status. Flags 029+ AUSENTES.
      pub fn run_execute(dag, action: ExecuteAction, renderer) -> ExitCode
      ExecuteAction::{ Status, Next, Watch{interval_secs, max_ticks} }
      Fluxo Status/Next: root→resolve_project_rel(DEFAULT_DAG_REL, must_exist)→load_dag→
        ensure_state(SystemClock)→compute_ranks?→canvas::write→format.
      NÃO transition(Start). JSON shapes §5.7 camelCase; outcome strings congeladas.
      Human next ready: bloco por task id/title/complexity/rank/spec_file/prompt.
      Human resolved: MSG_RESOLVED; blocked: MSG_BLOCKED…; empty: MSG_EMPTY.
      Smokes MUST (cli_smoke filter execute): default status exit 0; --next ready;
        resolved; blocked; empty; missing dag→3; --status --next →2; cycle dag→4;
        --json status schema.
      Gate: cargo test -p dare-cli --test cli_smoke -- execute
      Sem watch completo ainda (mp028-004 pode stub Watch → Internal OU implementar mínimo
        que falha teste — preferir Watch arm chama helper placeholder Err só se não usado;
        se clap expõe --watch, smoke watch fica em 004; aqui --watch sem max_ticks pode
        ser Usage ou defer: ACEITÁVEL retornar invalid_input("watch not implemented") exit 4
        ATÉ mp028-004 — documentar no output).
      Sem docs/DEC. Sem git commit. Sem Ralph.

