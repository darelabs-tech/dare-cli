          artifact_refs: Vec<String>, artifact_digests: Vec<String>,
          verification_ref: String, verification_digest: String, verdict: Verdict,
          created_at: String, producer: Producer }
        SourceRevision { state: RevisionState, repositories: Vec<RepoRevision> }
        RevisionState enum { Clean, Dirty, Unattested } as "clean"/"dirty"/"unattested"
        RepoRevision { alias, commit_sha: Option<String>, worktree_digest: Option<String> }
        Verdict enum { Passed, Failed, Insufficient } lowercase
        Producer { cli_version: String, driver: String }
        SupersededReceipt { receipt_digest: String, created_at: String, reason: String }
        EvidenceState enum { Valid, Missing, Invalid, Stale, NotApplicable, Insufficient }
        RefusalCode enum with 13 variants: StrictNoContracts, ContractMissing,
          ReceiptMissing, ReceiptInvalid, ContractDigestMismatch,
          ArtifactDigestMismatch, VerificationDigestMismatch, GateNotSatisfied,
          VerdictNotPassed, NotFinal, RefEscape, SizeLimit, RevisionUnattested
        HandoffDecision { parent_id: String, state: EvidenceState,
          refusal: Option<RefusalCode>, detail: String,
          imported_digest: Option<String>, deliverable: Option<String> }
        HandoffPolicy { strict: bool, require_attested_revision: bool,
          require_contracts: bool, required_kind: HandoffKind }

      Functions:
        pub fn parse_contract_yaml(text: &str) -> CoreResult<TaskContract>
