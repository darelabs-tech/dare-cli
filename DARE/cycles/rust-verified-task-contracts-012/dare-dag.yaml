      MAX_ARTIFACT_REFS=512, MAX_TREE_DIGEST_BYTES=64*1024*1024, MAX_SUPERSEDED=16.

      Types, all `#[derive(Debug, Clone, Serialize, Deserialize, PartialEq)]` with
      `#[serde(rename_all = "camelCase")]` and `#[serde(flatten)] extra: Map<String,Value>`
      on TaskContract and HandoffRecord:
        TaskContract { schema_version: u32, task_id: String, goal: String,
