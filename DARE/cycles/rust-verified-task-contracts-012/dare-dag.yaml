  - id: task-003
    title: Deterministic digests for contract, file and tree with size caps
    depends_on: [task-002]
    complexity: MED
    spec_file: cycles/rust-verified-task-contracts-012/EXECUTION/task-003.md
    subtask_prompt: |
      Add the digest layer to `crates/dare-contracts/src/handoff.rs`.

      pub fn digest_bytes(data: &[u8]) -> String
        hex lowercase SHA-256, 64 chars.
      pub fn material_digest(c: &TaskContract) -> CoreResult<String>
        1. Project the contract onto the FIXED material key set: schemaVersion,
           taskId, goal, scope, acceptance, verification, exitCriteria,
           startingContext. Everything else, including `extra`, is discarded.
        2. serde_json::to_value of the projection.
        3. dare_core::to_canonical_json_string (recursively sorts keys).
        4. digest_bytes of the UTF-8 bytes.
      pub fn full_digest(c: &TaskContract) -> CoreResult<String>
        Steps 2..4 over the whole contract, `extra` included.
      pub fn digest_file(root: &ProjectRoot, rel: &SafeRelativePath) -> CoreResult<String>
        Streaming SHA-256 in 64 KiB blocks — never read the whole file into memory.
        Missing -> CoreError::not_found. Larger than MAX_TREE_DIGEST_BYTES ->
        CoreError::config("artifact exceeds digest size limit").
      pub fn digest_tree(root: &ProjectRoot, globs: &[String]) -> CoreResult<TreeDigest>
        TreeDigest { digest: String, file_count: u32, total_bytes: u64,
                     skipped_symlinks: u32 }
        Expand globs with globset against the project root; collect REGULAR files
        only; sort by POSIX relative path; feed "{path}\n{file_digest}\n" per entry
        into one hasher; digest is of that concatenation.
        Symlinks are NOT followed: counted in skipped_symlinks, excluded from the
        digest. Zero matches -> digest of the empty string with file_count 0 (not an
        error). file_count > MAX_ARTIFACT_REFS or total_bytes > MAX_TREE_DIGEST_BYTES
        -> CoreError::config with "size limit" in the message.

      Determinism is the whole point: the result must not depend on read_dir order,
      on the OS, or on path separators. Normalise to "/" before sorting and hashing.

      Add `globset = { workspace = true }` to crates/dare-contracts/Cargo.toml.

      Tests: material_digest unchanged when a non-material field (owner,
      requirementRefs, an extra key) changes; material_digest CHANGES when goal,
      scope, acceptance or exitCriteria change (4 separate assertions);
      full_digest changes in both cases; material_digest stable across two YAML
      documents whose keys are written in different order; digest_file matches a
      known SHA-256 vector; digest_tree stable under shuffled insertion order;
      digest_tree with zero matches; cap violations for both file_count and
      total_bytes; symlink counted and excluded (gate the symlink test on Unix with
      #[cfg(unix)]).
      Add a proptest: material_digest is invariant under permutation of map keys.

      Validation gate: cargo test -p dare-contracts; cargo clippy -p dare-contracts
      --all-targets -- -D warnings; cargo fmt --all -- --check.

  - id: task-004
    title: Git provenance primitives head_sha, worktree_state and changed_files
    depends_on: []
    complexity: MED
    spec_file: cycles/rust-verified-task-contracts-012/EXECUTION/task-004.md
    subtask_prompt: |
      Extend `crates/dare-project/src/git.rs` with provenance helpers. Today the file
      only has find_git_root; follow its exact style: SafeCommand with
      .cwd(root, rel), .timeout(Duration::from_secs(5)), .stdout_limit(4096), run
      through SystemProcessRunner, and NEVER return Err for a missing git — degrade
      to None.

      pub fn head_sha(root: &ProjectRoot) -> Option<String>
        `git rev-parse HEAD`. Returns Some only when exit_code == 0 and stdout
        trimmed matches ^[0-9a-f]{40}$. Anything else -> None. A repository with no
        commits yet (rev-parse fails) -> None, never a fabricated sha.
      pub fn worktree_is_dirty(root: &ProjectRoot) -> Option<bool>
        `git status --porcelain`. Some(true) when stdout is non-empty after trim,
        Some(false) when empty, None when git is unavailable or exits non-zero.
        Note the stdout_limit: a huge dirty tree may truncate, which still correctly
        means dirty.
      pub fn changed_files(root: &ProjectRoot, from_sha: &str, to_sha: Option<&str>)
          -> Option<Vec<String>>
        `git diff --name-only <from>..<to>` (or `git diff --name-only <from>` when
        to_sha is None, which includes the working tree). Validate from_sha and
        to_sha against ^[0-9a-f]{7,40}$ BEFORE building the command and return None
        on a mismatch — this is the argument-injection guard, do not pass unvalidated
        strings to git. Returns POSIX relative paths, sorted, deduplicated. Entries
        that escape the project root are dropped.
        Raise stdout_limit to 65536 for this call only.

      All three take &ProjectRoot and resolve "." as the cwd, like try_git_rev_parse
      already does.

      Tests: in a tempdir WITHOUT .git, all three return None; with a real git repo
      created via SafeCommand (git init, git config user.email/name, commit a file),
      head_sha matches the 40-hex shape, worktree_is_dirty is Some(false) after
      commit and Some(true) after touching a tracked file, changed_files between two
      commits lists exactly the changed path. Guard the repo tests with a helper that
      skips when `git` is absent from PATH, so CI without git still passes.
      Invalid sha arguments ("--upload-pack=evil", "; rm -rf /", "zzz") return None
      without spawning git.

      Validation gate: cargo test -p dare-project; cargo clippy -p dare-project
      --all-targets -- -D warnings; cargo fmt --all -- --check.

  - id: task-005
    title: Receipt emission and required-gate satisfaction in dare-verify
    depends_on: [task-003, task-004]
    complexity: HIGH
    spec_file: cycles/rust-verified-task-contracts-012/EXECUTION/task-005.md
    subtask_prompt: |
      Create `crates/dare-verify/src/handoff.rs`, declare `pub mod handoff;` in
      `crates/dare-verify/src/lib.rs` and re-export the public items.
      Add `dare-project = { workspace = true }` to crates/dare-verify/Cargo.toml.

      pub fn gates_satisfied(report: &VerificationReport, required: &[GateAspect])
          -> Result<(), Vec<GateAspect>>
        Ok(()) iff for EVERY a in required there is a step in report.aspects with
        step.aspect == a, step.exit_code == 0 and !step.timed_out.
        Do NOT trust report.ok: a report with ok == true but a required aspect
        missing from `aspects` must return Err. Err lists the missing/failed aspects
        in the order they appear in `required`. Duplicated aspects in `aspects`: one
        passing step is enough. Empty `required` -> Ok(()).

      pub struct ReceiptRequest<'a> { task_id: &'a str, contract: &'a TaskContract,
        revision: &'a SourceRevision, created_at: &'a str, driver: &'a str }
      pub fn receipt_from_verification(root: &ProjectRoot, req: &ReceiptRequest<'_>)
          -> CoreResult<VerificationReceipt>
        Reads `.dare/verification/<task_id>.json` FROM DISK via load_verification —
        it must not accept a RalphReport or a bool parameter. That is what prevents
        circular proof.
        - report missing -> CoreError::not_found (caller maps to Insufficient and
          emits no receipt)
        - report.ok == false -> CoreError::config(
            "refusing to emit receipt for failed verification")
        - verification_digest = digest_file of that same path
        - contract_digest = material_digest(contract),
          contract_full_digest = full_digest(contract)
        - artifact_refs / artifact_digests per the A-06 strategy:
            revision.state == Clean  -> refs from the caller-supplied changed files
              intersected with contract.scope.allowed_paths globs, sorted; per-file
              digest_file; no worktree digest
            revision.state == Dirty  -> same refs, plus digest_tree over
              allowed_paths stored in the matching RepoRevision.worktree_digest
            revision.state == Unattested -> refs empty; worktree_digest from
              digest_tree. The receipt IS still emitted; sufficiency is a consumption
              decision, not an emission one.
        - verdict = Verdict::Passed (this function is only reached when gates passed)
        - producer = Producer { cli_version: env!("CARGO_PKG_VERSION").into(),
            driver: req.driver.into() }
        - created_at = req.created_at verbatim (Clock is injected by the caller, the
          same pattern verification_from_ralph already uses)
        - contract.owner, if present, passes through dare_core::redact
        INVARIANT: artifact_refs.len() == artifact_digests.len(), same index = same
        file. Assert it before returning.
        Cap violations from digest_tree/digest_file propagate as CoreError::config.

      Tests with tempfile + ProjectRoot: gates_satisfied for all-pass, missing
      aspect, failed exit code, timed_out, duplicate aspects, empty required;
      receipt refuses to be emitted when the report is missing and when ok == false;
      digests match independently recomputed values; the three revision states
      produce the documented refs/worktree_digest shapes; refs/digests lengths equal;
      a secret in contract.owner comes out redacted.
      Use FixedClock-style fixed created_at strings so assertions are exact.

      Validation gate: cargo test -p dare-verify; cargo clippy -p dare-verify
      --all-targets -- -D warnings; cargo fmt --all -- --check.

  - id: task-006
    title: Handoff sidecar store with atomic write, lock and supersede
    depends_on: [task-003]
    complexity: MED
    spec_file: cycles/rust-verified-task-contracts-012/EXECUTION/task-006.md
    subtask_prompt: |
      Create `crates/dare-verify/src/handoff_store.rs` (a SEPARATE file from
      handoff.rs so this task and task-005 never edit the same file) and declare
      `pub mod handoff_store;` in `crates/dare-verify/src/lib.rs`.

      pub fn write_handoff(root: &ProjectRoot, record: &HandoffRecord) -> CoreResult<()>
        - reject unsafe task ids: CoreError::invalid_input("unsafe handoff task id: {id}")
        - apply dare_core::redact to deliverable, every next_steps entry and every
          open_items entry on a CLONE of the record, exactly as write_verification
          redacts stdout_tail/stderr_tail
        - reject record.schema_version != 1 with CoreError::config
        - reject kind == FollowUpHandoff with an empty open_items:
          CoreError::config("follow-up handoff requires at least one open item")
        - serialise via serde_json::to_value + dare_core::to_canonical_json_string
        - acquire FileLock::try_acquire on `.dare/handoff/<id>.json.darelock`, then
          atomic_write to `.dare/handoff/<id>.json`. Lock contention is fail-fast:
          let the CoreError::io("file lock held") propagate, no queueing — same
          contract as .dare/state.json.
      pub fn load_handoff(root: &ProjectRoot, task_id: &str) -> CoreResult<HandoffRecord>
        read_limited (2 MiB cap) + from_json_slice; schema_version != 1 ->
        CoreError::config("unsupported handoff schema version").
      pub fn handoff_exists(root: &ProjectRoot, task_id: &str) -> CoreResult<bool>
      pub fn supersede_handoff(root: &ProjectRoot, task_id: &str, reason: &str,
          at: &str) -> CoreResult<()>
        Load the record; push SupersededReceipt { receipt_digest: digest of the
        canonical current receipt, created_at: at, reason: redact(reason) } onto
        `superseded`; truncate FIFO (drop oldest) to MAX_SUPERSEDED; rewrite
        atomically under the same lock. A missing record is Ok(()) — idempotent, so
        it can be called unconditionally on Reset.

      Tests: write/load round-trip with canonical key order on disk; a secret in
      deliverable and in next_steps comes out redacted; unsafe id rejected; oversize
      file rejected; follow-up with empty open_items rejected; supersede on a missing
      record is Ok; supersede twice accumulates two entries; superseded FIFO cap
      drops the oldest at MAX_SUPERSEDED + 1; concurrent lock held -> Io error
      mentioning the lock.

      Validation gate: cargo test -p dare-verify; cargo clippy -p dare-verify
      --all-targets -- -D warnings; cargo fmt --all -- --check.

  - id: task-007
    title: Consumer evaluation evaluate_parent with the twelve ordered checks
    depends_on: [task-005, task-006]
    complexity: HIGH
    spec_file: cycles/rust-verified-task-contracts-012/EXECUTION/task-007.md
    subtask_prompt: |
      Add `evaluate_parent` to `crates/dare-verify/src/handoff.rs`.

      pub fn evaluate_parent(root: &ProjectRoot, dag_rel: &SafeRelativePath,
          parent_id: &str, policy: &HandoffPolicy) -> HandoffDecision

      It does NOT return Result: every failure is a HandoffDecision carrying a
      RefusalCode, because the decision is the product.

      The order of checks is part of the testable contract — the FIRST failure wins:
        1  handoff record exists                      -> ReceiptMissing
        2  deserialises, schema_version == 1, and
           artifact_refs.len() == artifact_digests.len() -> ReceiptInvalid
        3  every path in the receipt is a confined SafeRelativePath -> RefEscape
        4  contract exists, when policy.require_contracts     -> ContractMissing
        5  material_digest(contract on disk) == receipt.contract_digest
                                                       -> ContractDigestMismatch
        6  digest_file(receipt.verification_ref) == receipt.verification_digest
                                                       -> VerificationDigestMismatch
        7  gates_satisfied(report, contract.verification.required_gates)
                                                       -> GateNotSatisfied
        8  receipt.verdict == Passed                   -> VerdictNotPassed
        9  every artifact_digest matches the file on disk RIGHT NOW
                                                       -> ArtifactDigestMismatch
       10  revision.state != Unattested, when policy.require_attested_revision
                                                       -> RevisionUnattested
       11  record.kind == policy.required_kind         -> NotFinal
       12  any size cap hit while reading               -> SizeLimit

      Steps 5, 6 and 9 MUST re-read from disk at call time — no caching, no reuse of
      a value read earlier in the same process. That is the TOCTOU mitigation.

      On success: HandoffDecision { state: Valid, refusal: None,
        imported_digest: Some(digest of the canonical receipt),
        deliverable: Some(record.deliverable) }.
      On failure: state is Missing for check 1, Invalid for 2/3/5/6/9,
        Insufficient for 7/8/10/12, NotApplicable for 11 when the parent is a
        legitimate follow-up, and refusal/detail set. `deliverable` is None and
        `imported_digest` is None on every failure.
      INVARIANT, assert it and cover with a proptest: state == Valid iff
      refusal.is_none() iff deliverable.is_some().
      `detail` always passes through dare_core::redact before being returned, and
      names the offending path or digest prefix (first 12 chars) so the refusal is
      diagnosable without leaking contents.

      Tests, one per refusal code (12 negative tests) plus the positive path, built
      on tempdir fixtures: tamper the contract goal; tamper an artifact byte; tamper
      the verification report; delete the report; a report with a missing required
      gate; verdict Failed; unattested revision with the policy requiring attested;
      a follow-up handoff where verified-deliverable is required; a receipt with an
      absolute path and one with ".."; mismatched refs/digests lengths; oversize
      contract. Assert the ORDER: a fixture broken in two ways reports the
      lower-numbered check.

      Validation gate: cargo test -p dare-verify; cargo clippy -p dare-verify
      --all-targets -- -D warnings; cargo fmt --all -- --check.

  - id: task-008
    title: ParentEvidence port and compose_task_prompt_verified in dare-dag
    depends_on: [task-003]
    complexity: MED
    spec_file: cycles/rust-verified-task-contracts-012/EXECUTION/task-008.md
    subtask_prompt: |
      Edit `crates/dare-dag/src/execution.rs` and re-export from
      `crates/dare-dag/src/lib.rs`. Do NOT add dare-verify to
      crates/dare-dag/Cargo.toml — the whole point is that dare-dag keeps its current
      dependency tree (dare-core + dare-contracts only).

      pub trait ParentEvidence { fn decide(&self, parent_id: &str) -> HandoffDecision; }
      pub struct ComposedPrompt { pub prompt: String, pub imported: Vec<String>,
        pub refused: Vec<HandoffDecision> }

      pub fn compose_task_prompt_verified(doc: &DagDocument, state: &RuntimeStateV1,
          task_id: &str, ev: &dyn ParentEvidence)
          -> Result<ComposedPrompt, DagGraphError>

      Mirror the existing compose_task_prompt exactly, then insert the gate:
        - task not found -> DagGraphError::InvalidDag { message: format!("task not
          found: {task_id}") } — the SAME message string as today
        - limit = parent_context_limit(doc); deps = meta.depends_on sorted
        - for each dep: skip when absent from state, skip when status != DONE
          (unchanged), then call ev.decide(dep_id)
        - state == Valid -> push dep_id to `imported` and append the section using
          the decision's `deliverable` (trimmed; skip when empty, as today):
          "### From parent: {dep_id} — {title}\n{unicode_tail(deliverable, limit)}\n"
        - anything else -> push the decision to `refused` and append NOTHING
        - if no section was appended, prompt == meta.subtask_prompt with no
          "## Upstream context" header; otherwise
          format!("{}\n\n## Upstream context\n\n{}", subtask_prompt, upstream)
        `imported` and `refused` are in the sorted dep order.

      Leave `compose_task_prompt` and `build_next_report` UNTOUCHED. Byte-identical
      legacy output is the contract, not an aspiration.

      Tests with a fake ParentEvidence (no filesystem): a stub returning Valid with
      deliverable == state output for every DONE parent produces a prompt
      BYTE-IDENTICAL to compose_task_prompt for the same fixture — assert
      `assert_eq!` between the two functions for at least 3 fixtures (no parents,
      one parent, two parents with a truncating limit); all-refused yields the bare
      subtask_prompt and a populated `refused`; mixed accept/refuse keeps only the
      accepted sections; a DONE parent with an empty deliverable is skipped; a legacy
      DagDocument (empty subtask_prompt) behaves as today; task not found returns the
      exact legacy message.

      Validation gate: cargo test -p dare-dag; cargo clippy -p dare-dag --all-targets
      -- -D warnings; cargo fmt --all -- --check.

  - id: task-009
    title: CLI policy resolution, strict-handoff flags and the strict preflight
    depends_on: [task-007, task-008]
    complexity: HIGH
    spec_file: cycles/rust-verified-task-contracts-012/EXECUTION/task-009.md
    subtask_prompt: |
      Wire the policy and the preflight into the CLI.

      Create `crates/dare-cli/src/commands/handoff_policy.rs`:
        pub struct HandoffFlags { pub strict: bool, pub no_strict: bool }
        pub fn handoff_policy_from_cfg(cfg: &DareConfig, flags: &HandoffFlags)
            -> HandoffPolicy
        Read from cfg.extra exactly like verify_enabled_from_cfg does
        (crates/dare-verify/src/advanced.rs): cfg.extra["handoff"]["strict"] as bool,
        default false; ["handoff"]["requireAttestedRevision"] default false;
        ["handoff"]["requireContracts"] default = the resolved strict value.
        Precedence: --strict-handoff > --no-strict-handoff > config > false.
        required_kind is always HandoffKind::VerifiedDeliverable in v1.

      Create `crates/dare-cli/src/commands/handoff_preflight.rs`:
        pub struct PreflightReport { pub schema_version: u32, pub strict: bool,
          pub tasks_total: u32, pub tasks_with_contract: u32,
          pub violations: Vec<(String, ContractViolation)> }
        pub fn run_handoff_preflight(root: &ProjectRoot, dag_rel: &SafeRelativePath,
            doc: &DagDocument, policy: &HandoffPolicy) -> CoreResult<PreflightReport>
        Only called when policy.strict. Counts tasks in the DAG and how many have a
        contract, accumulating validate_contract violations for those present.
        tasks_with_contract == 0 -> Err(CoreError::guard_fail(format!(
          "handoff preflight failed: strict mode enabled but no task contract found
          under {dir}"))) which is exit 6. Blocking violations -> guard_fail listing
          at most 10 plus the total count.
        Follow the shape of crates/dare-guard/src/preflight.rs::run_preflight.
        A missing contracts/ directory gives the same refusal as zero contracts, and
        the message must name the expected directory.

      In `crates/dare-cli/src/main.rs`, on the Execute subcommand, add:
        #[arg(long = "strict-handoff", action = clap::ArgAction::SetTrue,
              overrides_with = "no_strict_handoff")] strict_handoff: bool,
        #[arg(long = "no-strict-handoff", action = clap::ArgAction::SetTrue)]
        no_strict_handoff: bool,
      Thread them to the execute handlers. Do not add conflicts_with beyond the
      mutual pair and do not change any existing flag's semantics.

      In `execute.rs` and `execute_agent.rs`: resolve the policy, run the preflight
      before any prompt composition when strict, and use
      compose_task_prompt_verified with a CliParentEvidence that delegates to
      dare_verify::handoff::evaluate_parent. When !strict, keep calling the original
      compose_task_prompt so the default path is untouched. In compat mode a refusal
      prints to STDERR only:
        "warning: handoff from {id} not verified ({CODE}); imported anyway"
        "         (compatibility mode — this is not verification; enable
                   handoff.strict to block)"
      and the prompt is composed exactly as today — stdout must not change.

      Tests: policy precedence matrix (flag on/off x config true/false/absent);
      preflight refuses with zero contracts on a v2.1 and on a legacy DAG and names
      the directory; preflight passes with one contract out of three; strict refusal
      exits 6; compat run exits 0 with the warning on stderr and unchanged stdout.

      Validation gate: cargo test -p dare-cli; cargo clippy -p dare-cli --all-targets
      -- -D warnings; cargo fmt --all -- --check.

  - id: task-010
    title: Receipt emission on complete, supersede on reset and JSON fields
    depends_on: [task-009]
    complexity: HIGH
    spec_file: cycles/rust-verified-task-contracts-012/EXECUTION/task-010.md
    subtask_prompt: |
      Close the producer side in `crates/dare-cli/src/commands/execute.rs`.
      This task edits the same file as task-009, which is why it depends on it.

      In run_complete_inner, AFTER the advanced verdict passes and the
      Transition::Complete has been applied (so the receipt describes a task that
      really reached DONE):
        1. load the contract via dare_contracts::handoff::load_contract(root,
           dag_rel, task_id). None -> emit no handoff record and no new JSON field;
           the run stays exactly as today (contracts are optional, D-06).
        2. recompute material_digest and compare with the digest recorded at Start.
           Divergence -> abort with
           CoreError::guard_fail(format!("contract changed after task start: {id}
           (HANDOFF_CONTRACT_DIGEST_MISMATCH)")) and a second line naming the
           recovery: "to adopt the new contract: dare execute --reset {id}".
           Record the Start digest in the state's per-task `extra` map under
           "handoffContractDigest" — TaskRuntimeState already preserves unknown
           fields via #[serde(flatten)] extra, so no schema change is needed. Do NOT
           add a required field to .dare/state.json.
        3. build the SourceRevision from dare_project::git: head_sha +
           worktree_is_dirty + changed_files(start_sha, None) for each
           contract.starting_context.repositories entry, defaulting to a single
           "self" alias when the list is empty. No git -> RevisionState::Unattested.
        4. receipt_from_verification with driver "cli" and created_at from the
           existing clock.
        5. write_handoff with kind from contract.exit_criteria.kind, deliverable =
           the same truncated output already stored by the transition,
           context_bounds = parent_context_limit(doc), next_steps/open_items from
           the contract when present else empty.
        Any failure in 3..5 after the task is already DONE must NOT roll the status
        back; surface it as an error whose message says the task is DONE but the
        receipt was not written, so the operator can rerun.

      In the Reset path, call supersede_handoff(root, task_id, "task reset",
      clock.now_rfc3339()) unconditionally — it is idempotent on a missing record.
      Same on a re-run of complete over an existing record, with reason "re-executed".

      Extend complete_json (execute.rs:686) with "handoffPath":
      ".dare/handoff/<id>.json" and "receipt": <the receipt as JSON>, only when a
      receipt was written. Extend the --next JSON so each `ready` item gains
      "handoff": { "strict": bool, "imported": [ids], "refused": [ { "parentId",
      "state", "code", "detail" } ] }. Fields are ADDITIVE — do not rename, reorder
      or remove anything already emitted.

      Tests: complete with a contract writes a valid sidecar whose digests verify;
      complete without a contract writes nothing and leaves stdout as the task-001
      golden; material change between Start and Complete is refused and the message
      names --reset; reset supersedes; re-complete supersedes with "re-executed";
      --complete --json carries handoffPath and receipt; --next --json carries the
      handoff block; the DONE-but-receipt-failed path reports honestly.

      Validation gate: cargo test -p dare-cli; cargo clippy -p dare-cli --all-targets
      -- -D warnings; cargo fmt --all -- --check.

