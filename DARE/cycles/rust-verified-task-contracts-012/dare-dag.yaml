          verification: ContractVerification, exit_criteria: ExitCriteria,
          starting_context: StartingContext, task_type: Option<String>,
          owner: Option<String>, requirement_refs: Vec<String>, extra }
        ContractScope { allowed_paths: Vec<String>, denied_paths: Vec<String> }
        AcceptanceCriterion { id: String, assertion: String }
        ContractVerification { required_gates: Vec<String> }
        ExitCriteria { kind: HandoffKind }
        StartingContext { source: String, repositories: Vec<RepoRef> }
        RepoRef { alias: String, repository_uri: Option<String> }
        HandoffKind enum { VerifiedDeliverable, FollowUpHandoff } serialised as
          "verified-deliverable" / "follow-up-handoff"
        HandoffRecord { schema_version, task_id, kind, receipt: VerificationReceipt,
          deliverable: String, context_bounds: u32, next_steps: Vec<String>,
