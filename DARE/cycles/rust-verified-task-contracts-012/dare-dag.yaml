        pub fn validate_contract(c: &TaskContract, file_stem: &str,
            dag_task_ids: &BTreeSet<String>) -> Vec<ContractViolation>
          Returns Vec, never Err, so the preflight can report everything at once.
          Order is deterministic: declared-field order, then index.
          ContractViolation enum variants: TaskIdUnsafe, TaskIdNotInDag,
