version: 1
tasks:
  - id: task-001
    title: Inventory existing diagnostics
    prompt: Inspect existing info, validate, doctor and lock implementations and document boundaries.
    depends_on: []
  - id: task-002
    title: Implement deterministic local diagnostics
    prompt: Add safe versioned codes for config, state and DAG presence without changing existing output contracts.
    depends_on: [task-001]
  - id: task-003
    title: Test invalid data and redaction
    prompt: Add deterministic regression tests for malformed and valid files and secret non-disclosure.
    depends_on: [task-002]
  - id: task-004
    title: Implement lock diagnostics
    prompt: Locate canonical locking semantics, safely distinguish active and stale locks, and test behavior.
    depends_on: [task-001]
  - id: task-005
    title: Implement opt-in support bundle
    prompt: Define preview, allowlist, local-only packaging, strict redaction and negative tests.
    depends_on: [task-002, task-004]
  - id: task-006
    title: Verify build test lint and audit
    prompt: Run cargo build, cargo test, cargo fmt, cargo clippy and applicable audit with pinned evidence.
    depends_on: [task-003, task-004, task-005]
  - id: task-007
    title: Publish operational playbook and proof
    prompt: Document diagnosis and recovery and attach actual CI verification evidence, leaving failures explicit.
    depends_on: [task-006]
