    subtask_prompt: |
      Microplano 018 Fase 2 — BLUEPRINT-018 §3–§5.1–5.3 T-01 T-03 T-06 T-08 T-09 T-12.
      1) Criar crates/dare-project (workspace member 0.1.0-alpha.0): deps dare-core, serde, serde_json.
