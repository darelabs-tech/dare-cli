      - detect(start): NotFound se missing; orquestra root/git/stacks/mono/harness; mode=check; zero writes
      - format_human + report_to_json; linha final "mode: check (zero mutations)"
      Testes: detect_monorepo_pnpm_workspace; detect_not_monorepo_single_package; detect_harnesses_sorted_four;
         detect_is_read_only; git_root_dot_git_dir; git_missing_degrades_to_null.
      Gate: cargo test -p dare-project
