      pub const VERIFICATION_DIR_REL: &str = ".dare/verification";
      VerificationReport { schema_version:u32=1, task_id, ok, timed_out, stack,
        aspects: Vec<GateStep>, updated_at: String } serde camelCase.
      pub fn task_id_is_path_safe(id: &str) -> bool
        regex ^[A-Za-z0-9][A-Za-z0-9._-]*$ (sem / \\ ..)
      pub fn write_verification(root: &ProjectRoot, report: &VerificationReport) -> CoreResult<()>
        se !task_id_is_path_safe → InvalidInput 4;
        SafeRelativePath "{VERIFICATION_DIR_REL}/{task_id}.json";
        criar dir .dare/verification; redact stdout_tail/stderr_tail via dare_core::redact;
        atomic_write JSON.
      pub fn verification_from_ralph(task_id, ralph: &RalphReport, clock_rfc3339) -> VerificationReport
      Testes FS MUST: write+read roundtrip; unsafe id "a/b" → Err; cria dir.
      Gate: cargo test -p dare-verify
      Sem CLI. Sem git commit.

  - id: mp029-004
    title: "CLI --complete + smokes Ralph mock"
    depends_on: [mp029-003]
    complexity: HIGH
    spec_file: EXECUTION-029/mp029-004.md
    subtask_prompt: |
      Microplano 029 Fase 4 — BLUEPRINT-029 §5 T-06–T-10 T-18 Apêndice C E.
      Estender Commands::Execute em main.rs:
        complete: Option<String> (long, value_name TASK_ID, conflicts status/next/watch/fail/reset)
        fail/reset Option<String> (podem stub Usage até mp029-005 — PREFERIR wiring Fail/Reset
          retornando invalid_input("not implemented") exit 4 ATÉ 005, OU implementar mínimo;
          smokes fail/reset ficam em 005)
        output: Option<String> requires=complete
        reason: Option<String> requires=fail
      ExecuteAction::{ Complete{id,output}, Fail{id,reason}, Reset{id}, Status, Next, Watch… }
      Fluxo Complete (Apêndice C):
        root→dag→load→ensure_state→task in DAG else NotFound 3→id path-safe else 4→
        resolve_stack+gate_commands→ensure_running (PENDING→transition Start RefreshCanvas::No)→
        run_ralph com SystemProcessRunner OU mock se env DARE_RALPH_MOCK:
          unset=real; 1|pass=3 steps exit0; fail=build exit1; timeout=build timed_out 124
        write_verification(ok=ralph.ok)→
        se timed_out: human MSG_COMPLETE_GATE_FAIL; ExitCode(124) SEM Complete→
        se !ok: ExitCode(1) SEM Complete (status RUNNING)→
        output=truncate(--output or "Task completed.") task_output_chars→
        transition(Complete{output}, RefreshCanvas::Yes)→write_verification ok=true→
        success MSG_COMPLETE_OK + JSON §5.5.
      dare-cli Cargo.toml: dep dare-verify.
      Smokes MUST (cli_smoke execute_complete_*):
        DARE_RALPH_MOCK=pass → DONE + verification ok;
        =fail → RUNNING + exit 1 + verif ok:false;
        =timeout → exit 124;
        missing task → 3; --complete --fail → 2; --status --complete → 2.
      Gate: cargo test -p dare-cli --test cli_smoke -- execute_complete
      Sem docs/DEC. Sem git commit. Sem --agent.

