    depends_on: []
    complexity: HIGH
    spec_file: EXECUTION-029/mp029-002.md
    subtask_prompt: |
      Microplano 029 Fase 2 — BLUEPRINT-029 §0 T-01–T-14 §4.1–4.3 §5.2.
      CRIAR crates/dare-verify/ (Cargo.toml edition 2021, version workspace 0.1.0-alpha.0).
      Adicionar member em Cargo.toml workspace; deps: dare-core, serde, serde_json.
      NÃO depender de dare-dag (T-02).
      src/lib.rs: pub mod ralph; pub mod stacks; re-exports.
      stacks.rs:
        pub fn resolve_stack(root: &ProjectRoot) -> CoreResult<String>
          Ler dare.config.json campo "backend" (string); se ausente e existe Cargo.toml
          → "rust-axum"; senão Err(invalid_input("unknown stack")).
        pub fn gate_commands(stack: &str) -> CoreResult<Vec<(GateAspect, SafeCommand)>>
          rust-axum|rust: 3 cmds cwd=root timeout 600s:
            build: cargo build --workspace
            test: cargo test --workspace
            lint: cargo clippy --workspace --all-targets -- -D warnings
          IDs conhecidos não-Rust (node-nestjs, python-fastapi, php-laravel, go-gin,
            go-stdlib, react, vue, rust-leptos, rust-leptos-csr, mcp-node-ts):
            Err(invalid_input) msg contém "not implemented"
          outro: Err msg contém "unknown stack"
      ralph.rs:
        GateAspect { Build, Test, Lint } + as_str build|test|lint
        GateStep { aspect, program, args, exit_code, timed_out, stdout_tail, stderr_tail, duration_ms }
        RalphReport { ok, timed_out, stack, steps, total_duration_ms } serde camelCase
        pub fn run_ralph(root, stack, runner: &dyn ProcessRunner, stdout_cap_chars: usize)
          -> CoreResult<RalphReport>
          gate_commands; short-circuit no primeiro exit≠0 ou timed_out (ProcessOutput exit 124);
          truncate tails via truncate_chars; ok iff all exit 0 && !timed_out.
      Testes MUST (MockProcessRunner): run_ralph_all_pass; run_ralph_fail_short_circuits
        (só 1 step); run_ralph_timeout_exit_124; resolve_stack_from_backend;
        gate_commands_not_implemented_nestjs.
      Gate: cargo test -p dare-verify
      Sem CLI. Sem verification.rs ainda (mp029-003). Sem git commit.

  - id: mp029-003
