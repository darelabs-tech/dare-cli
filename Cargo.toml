[workspace]
resolver = "2"
members = [
    "crates/dare-cli",
    "crates/dare-core",
    "crates/dare-contracts",
    "crates/dare-config",
    "crates/dare-assets",
    "crates/dare-harness",
    "crates/dare-project",
    "crates/dare-dag",
    "crates/dare-ai",
    "crates/dare-update",
    "crates/dare-verify",
    "crates/dare-agent",
    "crates/dare-ast",
    "crates/dare-skills",
    "crates/dare-review",
    "crates/dare-guard",
    "crates/dare-graph",
    "crates/dare-scaffold",
    "crates/dare-hooks",
    "crates/dare-steering",
    "crates/dare-server",
    "crates/dare-self",
    "crates/dare-parity",
]

[workspace.package]
version = "4.0.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"

[workspace.dependencies]
clap = { version = "=4.5.40", features = ["derive"] }
thiserror = "=2.0.12"
anyhow = "=1.0.104"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
assert_cmd = "=2.0.17"
predicates = "=3.1.3"
serde_json = "=1.0.140"
serde = { version = "=1.0.221", features = ["derive"] }
uuid = { version = "=1.16.0", features = ["v4"] }
anstream = "=0.6.18"
camino = "=1.1.9"
tempfile = "=3.20.0"
proptest = "=1.6.0"
fs4 = "=1.1.0"
sha2 = "=0.10.9"
regex = "=1.11.1"
tree-sitter = "=0.25.10"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-php = "=0.24.2"
tree-sitter-go = "=0.25.0"
tree-sitter-ruby = "=0.23.1"
tree-sitter-rust = "=0.24.2"
ed25519-dalek = { version = "=2.1.1", features = ["rand_core"] }
base64 = "=0.22.1"
kill_tree = "=0.2.4"
serde_yaml = { package = "yaml_serde", version = "=0.10.4" }
globset = "=0.4.16"
rust-embed = "=8.7.2"
axum = "=0.8.8"
tokio = { version = "=1.45.1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util"] }
tower-http = { version = "=0.6.8", features = ["limit", "set-header", "cors", "trace"] }
tower = "=0.5.2"
http-body-util = "=0.1.3"
dare-core = { path = "crates/dare-core" }
dare-contracts = { path = "crates/dare-contracts" }
dare-config = { path = "crates/dare-config" }
dare-assets = { path = "crates/dare-assets" }
dare-harness = { path = "crates/dare-harness" }
dare-project = { path = "crates/dare-project" }
dare-dag = { path = "crates/dare-dag" }
dare-ai = { path = "crates/dare-ai" }
dare-update = { path = "crates/dare-update" }
dare-verify = { path = "crates/dare-verify" }
dare-agent = { path = "crates/dare-agent" }
dare-ast = { path = "crates/dare-ast" }
dare-skills = { path = "crates/dare-skills" }
dare-review = { path = "crates/dare-review" }
dare-guard = { path = "crates/dare-guard" }
dare-graph = { path = "crates/dare-graph" }
dare-scaffold = { path = "crates/dare-scaffold" }
dare-hooks = { path = "crates/dare-hooks" }
dare-steering = { path = "crates/dare-steering" }
dare-server = { path = "crates/dare-server" }
dare-self = { path = "crates/dare-self" }
dare-parity = { path = "crates/dare-parity" }
ureq = { version = "=2.12.1", default-features = false, features = ["native-tls"] }
native-tls = "=0.2.18"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
fastembed = { version = "=4.9.1", default-features = false }
tar = "=0.4.45"
flate2 = "=1.0.35"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
dialoguer = "=0.11.0"
# MCP SDK (microplano 052) — features enabled per-crate (dare-server).
# schemars 1.2.2 satisfies rmcp 3.0.1's `schemars = "1.0"` (+ chrono04).
rmcp = { version = "=3.0.1", default-features = false }
rmcp-macros = "=3.0.1"
schemars = { version = "=1.2.2", features = ["chrono04"] }

[workspace.lints.rust]
unused = "warn"
dead_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
