services:
  governance-check:
    build:
      context: .
      dockerfile: Dockerfile.governance
    command: ["sh", "-c", "node scripts/governance/verify-all.mjs && exec sleep infinity"]
    healthcheck:
      test: ["CMD", "node", "scripts/governance/verify-structure.mjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
