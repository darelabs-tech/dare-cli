[package]
name = "dare-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "GraphRAG storage + ingest/search (keyword/BFS/RRF) — microplanos 040–041"

[features]
default = []
semantic = ["dep:fastembed"]
neo4j = ["dep:ureq", "dep:base64"]

[dependencies]
dare-core = { workspace = true }
dare-contracts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }
ureq = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

# windows-gnu: ort has no prebuilt binaries — load-dynamic (ORT_DYLIB_PATH at runtime).
# Other targets: download-binaries + hf-hub-native-tls (fastembed default set).
[target.'cfg(all(windows, target_env = "gnu"))'.dependencies]
fastembed = { workspace = true, optional = true, features = [
    "hf-hub-native-tls",
    "ort-load-dynamic",
] }

[target.'cfg(not(all(windows, target_env = "gnu")))'.dependencies]
fastembed = { workspace = true, optional = true, features = [
    "hf-hub-native-tls",
    "ort-download-binaries",
] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
