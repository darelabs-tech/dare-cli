    title: Diamond root
    depends_on: []
    complexity: LOW
    subtask_prompt: root
  - id: task-left
    title: Left branch
    depends_on: [task-root]
    complexity: MED
    subtask_prompt: left
  - id: task-right
    title: Right branch
    depends_on: [task-root]
