[advisories]
yanked = "deny"
# Blueprint §4.2: unmaintained = "warn" — cargo-deny 0.18.2 uses scope (all|workspace|transitive|none).
unmaintained = "transitive"

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "Unlicense",
  "blessing",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace `{ workspace = true }` path deps lack explicit versions; allow per cargo-deny 0.18.x.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
